name: evidence sync
on:
    push:
        branches:
            - main
jobs:
    detect-changes:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 2

            - name: Print modified files
              run: | 
                python3 backend/update_evidence.py
            
            - name: Commit evdience changes
              run: |
                git config user.name "github-actions"
                git config user.email "github-actions@github.com"

                if git diff --cached -- quite; then
                    echo "No evidence changes detected"
                else 
                    git commit -m "Evidnece updated"
                    git push 
                fi




